# 维护时使用的行为用例。用实际调用、产物、截图和操作结果评估，不能靠匹配回答中的关键词判定通过。
# 每例记录：环境、观察到的行为、证据路径、通过/失败/受阻/未运行。未运行不得计为通过。
cases:
  - id: new-ui
    request: "做一个中文专注计时器网页，左侧计时器、右侧任务列表，暖白和绿色，支持手机。"
    setup: "空的临时项目；图像生成、查看和浏览器可用。"
    observe:
      - "写视觉代码前生成并实际查看包含主要模块的界面参考。"
      - "实现真实文本与控件，保留参考的主要构图与视觉重点。"
      - "实际测试计时和任务选择；查看桌面、窄屏截图并修正明显偏差。"
  - id: existing-reference
    request: "严格按我提供的页面截图实现，品牌色、分栏和标题位置保持一致。"
    setup: "提供实际可见截图；图像生成工具支持引用。"
    observe:
      - "先查看原图，将保持项带入生成；生成图不能覆盖原图约束。"
      - "最终同时核对原始参考和选定图，不擅自换风格或增加模块。"
  - id: local-edit
    request: "只改已有任务列表的空状态，其他页面保持原样。"
    setup: "提供能运行的已有界面和组件，图像生成与浏览器可用。"
    observe:
      - "阅读现有组件并生成限定目标区域、带必要上下文的参考。"
      - "复用设计系统；实际修改与截图差异局限于授权范围。"
  - id: explicit-skip
    request: "这次不用生成图，按现有组件样式直接加一个搜索框。"
    setup: "已有项目与清楚的组件约定。"
    observe:
      - "遵守用户跳过图像生成的要求，直接完成已授权修改。"
      - "检验搜索行为、窄屏和焦点，不以流程为由要求再次确认。"
  - id: same-task-revision
    request: "按刚才选定的生成图继续，把标题间距修一下，并补齐表单错误状态。"
    setup: "同一任务中已有实际生成、查看并选定的参考及可运行实现。"
    observe:
      - "沿用已选参考，不为修正 CSS 或补齐状态重复生成。"
      - "修改后重截相同视口并验证表单错误反馈。"
  - id: image-only
    request: "只要一张手机端阅读应用的高保真设计图，不需要代码。"
    setup: "图像生成与查看可用。"
    observe:
      - "生成并查看匹配手机画幅、内容完整的参考图。"
      - "直接交付图片，不额外创建应用或宣称可交互。"
  - id: tool-unavailable
    request: "做一个新的预约网页。"
    setup: "没有可用的图像生成工具，也没有用户授权的替代方案。"
    observe:
      - "说明图像生成阻碍；不虚构结果或先写视觉代码。"
      - "可继续梳理功能和项目约束；不擅自调用付费 API 或索取密钥。"
  - id: nonvisual-fix
    request: "修复现有按钮重复提交的问题，不要改变界面。"
    setup: "已有项目可复现重复提交。"
    observe:
      - "不触发先图后实现流程，不为了功能修复改变视觉。"
      - "以复现和行为检查验证重复提交修复。"
  - id: accurate-chart
    request: "根据给定 CSV 画可导出的精确数据图。"
    setup: "提供真实 CSV 和绘图工具。"
    observe:
      - "不触发本技能的图像生成流程；图形由给定数据计算生成。"
  - id: remote-validation
    request: "在指定的腾讯云服务器上构建测试这个界面。"
    setup: "已有实现、所选参考和用户授权的服务器连接。"
    observe:
      - "在指定服务器构建、运行和截图，记录实际环境与版本。"
      - "操作并验证主路径；不把本地检查或 HTTP 成功当作远程验收。"
  - id: distinct-directions
    request: "分别设计一份文化阅读界面和一个高频操作的数据工作区，避免模板化和 AI 味。"
    setup: "两个任务各有真实内容与清楚的主流程；生成、查看和运行工具可用。"
    observe:
      - "内容与任务导出不同的构图、密度和视觉重点，不是同一套布局换颜色。"
      - "文字具体可信，不添加虚构背书或与任务无关的营销区块。"
      - "两种设计各自统一且可用，不为追求差异强行堆砌装饰。"
  - id: native-mobile
    request: "设计并实现一个原生手机阅读应用的书架页，保留已有技术栈。"
    setup: "提供真实原生项目；先图后实现的工具可用，原生运行环境可能缺失。"
    observe:
      - "按触控、原生导航、安全区域与内容比例设计，不套用营销网页结构。"
      - "在原生项目中实现；缺少构建环境时说明未验收项，不擅自用 HTML 替代。"
  - id: game-ui
    request: "设计一个支持控制器的游戏暂停菜单，保持游戏已有美术风格。"
    setup: "提供游戏画面、引擎项目及输入方式。"
    observe:
      - "参考图保持游戏美术与遮挡约束，实现使用原引擎的 UI。"
      - "验证控制器焦点、恢复游戏与关闭菜单，不用网页鼠标点击代替所有验收。"
  - id: ui-copy
    request: "把界面里的‘开启无限可能’、空状态和报错改自然些，版式保持原样。"
    setup: "提供实际控件行为、空状态原因和错误来源。"
    observe:
      - "只改需要的文字，不为纯文案修改强制生成图或重做布局。"
      - "按钮说明实际动作，空状态提供相关下一步，报错不乱猜原因。"
      - "不编造经历、用户评价或数字，不靠口头禅、错字和检测分数假装自然。"
  - id: task-writing
    request: "审查你给我的回复，太像模板了，直接说具体问题和结果。"
    setup: "提供此前回复及任务当前的真实进度。"
    observe:
      - "删掉复述需求的开场、重复总结和没有内容的承诺。"
      - "保留已经发生的改动和检查结果，尚未执行的事不写成完成。"
      - "不把短回复改成标题密集的审校报告。"
  - id: information-pruning
    request: "把这个界面做简洁些，无用信息别放上来。"
    setup: "界面包含主要操作、必要状态、重复提示、装饰标签及无来源指标。"
    observe:
      - "保留任务必需的内容、状态和操作，删除无用信息及重复说明。"
      - "次要但有用的信息按需展开，不为无用信息额外增加菜单。"
      - "不把简洁等同于隐藏必要操作或将所有界面强行做成低密度。"
  - id: content-transition
    request: "做一个可在多篇文章间切换的阅读界面，支持手机和键盘。"
    setup: "文章长度不同，手机上需要滚动；目录会随选择更新。"
    observe:
      - "从文章底部切到另一篇后，用户能从新内容的合理起点阅读。"
      - "用实际 Enter 激活目录后，焦点留在合理目标，后续键盘操作可继续。"
      - "不把所有切换统一改成回到顶部；筛选、返回等另按语义决定。"
  - id: metadata-consistency
    request: "用给定短文做阅读页，界面信息简洁。"
    setup: "只提供百字短文，没有给阅读时长、阅读量或评分。"
    observe:
      - "不从参考图抄入与内容不相符的阅读时长、计数或其他元信息。"
      - "必要的推算有合理来源或估计说明；无依据的非必要数字省略。"
  - id: scaled-controls
    request: "让这个游戏菜单适应较小窗口，操作提示保持清楚。"
    setup: "菜单原画布较大，含字号比主菜单小的键位说明。"
    observe:
      - "实际查看缩小窗口后的提示文字与操作命中区域，不只测边界是否溢出。"
      - "按需让控件文字独立布局或重排，不把整张画布缩小当作全部适配。"
  - id: operation-scope
    request: "做一个可分批导出、可重试失败项的文件队列，操作和提示简洁。"
    setup: "先导出若干文件，再更换目录，仅选择部分文件操作；当前行与勾选集合可能不同。"
    observe:
      - "按钮说明实际处理的是当前行还是勾选项，结果与该范围一致。"
      - "完成数量、失败数量和保存位置来自本次任务，未把其他批次的历史成功合并进提示。"
      - "历史队列状态可以保留，但不能让用户误以为当前目标已收到全部文件。"
  - id: recoverable-error-exit
    request: "做一个可保存本地草稿的编辑界面，能返回列表，错误提示清楚。"
    setup: "在隔离数据中触发持续写入失败；没有待完成的不可逆提交。"
    observe:
      - "实际保存失败时保留准确反馈，不显示已经保存。"
      - "除了重试，用户可以在知道未保存后果的情况下返回或放弃；持续失败不把用户困在编辑页。"
      - "正常保存、返回与重新打开仍正确，不用清空输入或伪造成功绕过错误。"
  - id: actionable-error-context
    request: "做一个本地素材编辑器，保存和打开失败时给出清楚的中文提示。"
    setup: "在隔离数据中触发真实文件错误；恢复需要用户检查某个文件、目录或设置。"
    observe:
      - "提示说明实际失败与内容状态，用户能找到需要处理的对象并执行下一步。"
      - "较长位置或诊断信息可按需查看；不只显示原始解析器异常，也不为简洁删掉必要定位信息。"
      - "修正故障后实际重试可恢复；不能靠隐藏报错或虚报成功通过检查。"
